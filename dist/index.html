<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Juegos Tradicionales - Lotería</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; text-align: center; margin: 0; padding: 20px; }
        .card { background: white; max-width: 400px; margin: 30px auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        #game-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .carta-loteria { background: #ffc107; padding: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; user-select: none; }
        .carta-loteria:hover { background: #e0a800; }
    </style>
</head>
<body>

    <h1>🇲🇽 Centro de Juegos Tradicionales 🇲🇽</h1>

    <!-- SECCIÓN DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="auth-section" class="card">
        <h2 id="form-title">Iniciar Sesión</h2>
        <input type="text" id="usuario" placeholder="Nombre de usuario"><br>
        <input type="email" id="correo" placeholder="Correo (solo para registro)" class="hidden"><br>
        <input type="password" id="password" placeholder="Contraseña"><br>
        <button id="btn-accion" onclick="manejarAuth()">Entrar</button>
        <p><a href="#" onclick="cambiarModo()" id="toggle-link">¿No tienes cuenta? Regístrate aquí</a></p>
        <p id="mensaje-error" style="color: red;"></p>
    </div>

    <!-- SECCIÓN DEL JUEGO DE LA LOTERÍA -->
    <div id="game-section" class="card hidden" style="max-width: 600px;">
        <h2>¡Bienvenido, <span id="span-user"></span>!</h2>
        <p>Lotería Tradicional Mexicana</p>
        <h3 id="carta-actual" style="color: #d9534f;">Carta cantada: ¡Ninguna! 🎴</h3>
        <button onclick="cantarCarta()">¡Cantar Siguiente Carta!</button>
        
        <div id="game-board">
            <div class="carta-loteria" onclick="marcarCarta(this)">La Sirena</div>
            <div class="carta-loteria" onclick="marcarCarta(this)">El Borracho</div>
            <div class="carta-loteria" onclick="marcarCarta(this)">La Rosa</div>
            <div class="carta-loteria" onclick="marcarCarta(this)">El Catrín</div>
            <div class="carta-loteria" onclick="marcarCarta(this)">El Nopal</div>
            <div class="carta-loteria" onclick="marcarCarta(this)">La Dama</div>
        </div>
        <p id="resultado-juego" style="font-weight: bold; margin-top: 15px;"></p>
    </div>

    <script>
        let esRegistro = false;
        let usuarioActual = "";

        function cambiarModo() {
            esRegistro = !esRegistro;
            document.getElementById("form-title").innerText = esRegistro ? "Registro de Usuario" : "Iniciar Sesión";
            document.getElementById("btn-accion").innerText = esRegistro ? "Registrarse" : "Entrar";
            document.getElementById("toggle-link").innerText = esRegistro ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate aquí";
            document.getElementById("correo").classList.toggle("hidden");
        }

        async function manejarAuth() {
            const nombre_usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const correo = document.getElementById("correo").value;
            const mensajeError = document.getElementById("mensaje-error");
            mensajeError.innerText = "";

            const endpoint = esRegistro ? "/api/registro" : "/api/login";
            const payload = esRegistro ? { nombre_usuario, correo, password } : { nombre_usuario, password };

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.exito) {
                    if (esRegistro) {
                        alert("¡Registro exitoso! Ahora inicia sesión.");
                        cambiarModo();
                    } else {
                        usuarioActual = nombre_usuario;
                        document.getElementById("span-user").innerText = usuarioActual;
                        document.getElementById("auth-section").classList.add("hidden");
                        document.getElementById("game-section").classList.remove("hidden");
                    }
                } else {
                    mensajeError.innerText = data.mensaje || "Ocurrió un error.";
                }
            } catch (error) {
                mensajeError.innerText = "Error de conexión con el servidor de Rust.";
            }
        }

        const barajaLoteria = [
            "El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", 
            "La Sirena", "La Escalera", "La Botella", "El Barril", "El Árbol", 
            "El Melón", "El Valiente", "El Gorrito", "La Muerte", "La Pera", 
            "La Bandera", "El Bandolón", "El Violoncello", "La Garza", "El Pájaro", 
            "La Mano", "La Bota", "La Luna", "El Cotorro", "El Borracho", 
            "El Negrito", "El Corazón", "La Sandía", "El Tambor", "El Camarón", 
            "Las Jaras", "El Músico", "La Araña", "El Soldado", "La Estrella", 
            "El Cazo", "El Mundo", "El Apache", "El Nopal", "El Alacrán", 
            "La Rosa", "La Calavera", "La Campana", "El Cantarito", "El Venado", 
            "El Sol", "La Corona", "La Chalupa", "El Pino", "El Pescado", 
            "La Palma", "La Maceta", "El Arpa", "La Rana"
        ];

        let cartaActualCantada = "";
        let puntajeUsuario = 0;

        function cantarCarta() {
            const indiceAleatorio = Math.floor(Math.random() * barajaLoteria.length);
            cartaActualCantada = barajaLoteria[indiceAleatorio];
            document.getElementById("carta-actual").innerText = `Carta cantada: ¡${cartaActualCantada}! 🎴`;
        }

        function marcarCarta(elemento) {
            const textoCarta = elemento.innerText;
            const resultadoP = document.getElementById("resultado-juego");

            if (textoCarta === cartaActualCantada) {
                elemento.style.backgroundColor = "#28a745";
                elemento.style.color = "white";
                puntajeUsuario += 10;
                resultadoP.style.color = "green";
                resultadoP.innerText = `¡Ándale! Le atinaste a ${textoCarta}. +10 puntos (Total: ${puntajeUsuario}) 🎯`;
            } else {
                puntajeUsuario = Math.max(0, puntajeUsuario - 5);
                resultadoP.style.color = "red";
                resultadoP.innerText = `¡Tache! Cayó "${cartaActualCantada}", no esa. -5 puntos.`;
            }
        }
    </script>
</body>
</html>
